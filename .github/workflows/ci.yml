name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src

  build:
    name: Build and wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build artifacts
        run: python -m pip install build && python -m build
      - name: Install built wheel and exercise public entry points
        run: |
          python -m venv .tmp-verify
          .tmp-verify/bin/python -m pip install dist/*.whl
          .tmp-verify/bin/steam-shortcuts --help
          .tmp-verify/bin/python -c "from steam_shortcuts import add_shortcut; assert callable(add_shortcut)"
