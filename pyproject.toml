[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-shortcuts"
version = "0.1.0"
description = "Safely add non-Steam shortcuts through a Python API and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rodrigo Machado"}]
keywords = ["steam", "shortcuts", "games", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "psutil>=5.9,<8",
    "vdf>=3.4,<4",
]

[project.urls]
Homepage = "https://github.com/msrodrigobr/steam-shortcuts"
Source = "https://github.com/msrodrigobr/steam-shortcuts"
Issues = "https://github.com/msrodrigobr/steam-shortcuts/issues"

[project.scripts]
steam-shortcuts = "steam_shortcuts.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.0,<3",
    "pytest>=8,<10",
    "ruff>=0.10,<1",
    "types-psutil>=7,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
warn_unreachable = true
